version: 2
updates:
  # requirements-dev.txt und requirements-build.txt
  - package-ecosystem: "pip"
    directory: "/"
    # Untergrenzen nennen die aelteste laufende Fassung und bleiben stehen,
    # solange sie die neue Fassung zulassen. Angehoben werden nur die festen
    # Versionen in requirements-build.txt.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Versionen der GitHub-Actions in den Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
