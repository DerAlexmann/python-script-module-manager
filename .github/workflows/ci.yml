name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stil:
    name: Stil (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      # Auf den Linux-Läufern fehlt eine Anzeige; die Tests der Oberfläche
      # überspringen sich dort von selbst, die übrigen laufen überall.
      - run: python -m pytest tests -q

  bauversionen:
    name: Feste Bauversionen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r requirements-build.txt
      # Wie im Release: Die Versionsdatei muss PyInstaller wirklich annehmen,
      # und BAU_PFLICHT verbietet das Überspringen dieser Prüfungen.
      - run: python -m pytest tests/test_verpackung.py -q
        env:
          BAU_PFLICHT: "1"
