name: Release

# Baut bei einem Versions-Tag (z. B. v2.0.0) eine Windows-EXE und ein
# Quellpaket und haengt beides an einen Release-Entwurf.
#
# Die EXE entsteht im --onefile-Modus. programm_ordner() erkennt den gepackten
# Zustand (sys.frozen) und legt die Einstellungen neben die EXE statt in den
# temporaeren Entpackordner. Scripts und pip laufen auch in der EXE ueber die
# gefundenen Python-Installationen - eine davon muss auf dem Rechner sein.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: "Python-Script & Module Manager"

jobs:
  quellpaket:
    name: Quellpaket (ZIP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ZIP packen
        run: |
          mkdir -p "out/$NAME"
          cp "$NAME.pyw" README.md README.en.md LICENSE CHANGELOG.md "out/$NAME/"
          cd out && zip -r "python-script-module-manager-${GITHUB_REF_NAME}-quellen.zip" "$NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: quellpaket
          path: out/*.zip

  windows-exe:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "${{ env.NAME }}"
          --icon "script_module_manager.ico"
          "${{ env.NAME }}.pyw"

      - name: Startet die EXE ueberhaupt?
        # Ein reiner Rauchtest: die EXE wird gestartet und nach einer Weile
        # beendet. Faellt sie sofort um, schlaegt der Job fehl.
        run: |
          $p = Start-Process -FilePath "dist\$env:NAME.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "Die EXE hat sich sofort beendet (Exit $($p.ExitCode))." }
          Stop-Process -Id $p.Id -Force
          Write-Output "EXE laeuft."

      - name: Pruefsumme
        run: |
          $h = (Get-FileHash "dist\$env:NAME.exe" -Algorithm SHA256).Hash
          Write-Output "SHA-256: $h"
          "$h  $env:NAME.exe" | Out-File -Encoding ascii "dist\SHA256SUMS.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

  release:
    name: Release-Entwurf anlegen
    needs: [quellpaket, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefakte

      - name: Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          draft: true          # erst pruefen, dann von Hand veroeffentlichen
          generate_release_notes: true
          files: |
            artefakte/quellpaket/*.zip
            artefakte/windows-exe/*.exe
            artefakte/windows-exe/SHA256SUMS.txt
