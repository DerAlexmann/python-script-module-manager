name: Release

# Baut bei einem Versions-Tag (z. B. v2.0.0) eine Windows-EXE und ein
# Quellpaket und haengt beides an einen Release-Entwurf.
#
# Die EXE entsteht im --onefile-Modus. programm_ordner() erkennt den gepackten
# Zustand (sys.frozen) und legt die Einstellungen neben die EXE statt in den
# temporaeren Entpackordner. Scripts und pip laufen auch in der EXE ueber die
# gefundenen Python-Installationen - eine davon muss auf dem Rechner sein.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: "Python-Script & Module Manager"
  # GitHub erlaubt in Asset-Namen weder Leerzeichen noch "&" und macht sonst
  # "Python-Script.Module.Manager.exe" daraus. Die EXE bekommt deshalb fuer
  # den Download einen eigenen, sauberen Namen.
  ASSET: "Python-Script-Module-Manager.exe"

jobs:
  quellpaket:
    name: Quellpaket (ZIP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ZIP packen
        run: |
          mkdir -p "out/$NAME"
          cp "$NAME.pyw" README.md README.en.md LICENSE NOTICE DRITTANBIETER-LIZENZEN.md CHANGELOG.md "out/$NAME/"
          # Schraegstriche im Ref-Namen ersetzen: Ein Probelauf von einem Zweig
          # wie dependabot/pip/... zeigte sonst in einen Ordner, den es nicht gibt.
          cd out && zip -r "python-script-module-manager-${GITHUB_REF_NAME//\//-}-quellen.zip" "$NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: quellpaket
          if-no-files-found: error
          path: out/*.zip

  windows-exe:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Versionsangaben erzeugen
        run: python versionsinfo_erzeugen.py

      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "${{ env.NAME }}"
          --icon "script_module_manager.ico"
          --version-file "versionsinfo.txt"
          "${{ env.NAME }}.pyw"

      - name: Download-Namen vergeben
        run: Move-Item "dist\$env:NAME.exe" "dist\$env:ASSET"

      - name: Versionsangaben der EXE pruefen
        # Liest die fertige Datei zurueck; bei einem Tag muss die Version dazu
        # passen, sonst wurde die Anhebung von VERSION vergessen.
        run: |
          $info = (Get-Item "dist\$env:ASSET").VersionInfo
          if (-not $info.ProductName -or -not $info.ProductVersion) {
            throw "Die EXE traegt keine Versionsangaben."
          }
          Write-Output "$($info.ProductName) $($info.ProductVersion)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$($info.ProductVersion)" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zu Version $($info.ProductVersion)."
          }

      - name: Erreicht die EXE das Programmfenster?
        # Der Prozess allein beweist wenig: Auch ein Fehlerfenster haelt ihn am
        # Leben. Deshalb wird auf den Titel des Hauptfensters gewartet. Die EXE
        # entpackt sich in einen Kindprozess, beide tragen denselben Namen.
        run: |
          $stamm = [IO.Path]::GetFileNameWithoutExtension($env:ASSET)
          $p = Start-Process -FilePath "dist\$env:ASSET" -PassThru
          $fenster = $null
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            $fenster = Get-Process -Name $stamm -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowTitle -eq $env:NAME } | Select-Object -First 1
            if ($fenster) { break }
            if ($p.HasExited) { throw "Die EXE hat sich beendet (Exit $($p.ExitCode))." }
          }
          if (-not $fenster) { throw "Das Programmfenster erschien nicht." }
          Get-Process -Name $stamm | Stop-Process -Force
          Write-Output "Programmfenster erreicht."

      - name: Pruefsumme
        run: |
          $h = (Get-FileHash "dist\$env:ASSET" -Algorithm SHA256).Hash
          Write-Output "SHA-256: $h"
          "$h  $env:ASSET" | Out-File -Encoding ascii "dist\SHA256SUMS.txt"

      - name: Lizenzhinweise neben die EXE legen
        # Ergaenzt die Datei um die Texte von Python und PyInstaller aus genau
        # diesem Bau; fehlt einer, bricht der Job ab.
        run: python lizenzen_anfuegen.py

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/DRITTANBIETER-LIZENZEN.md

  release:
    name: Release-Entwurf anlegen
    needs: [quellpaket, windows-exe]
    runs-on: ubuntu-latest
    # Ohne Tag kennt die Action keinen Namen fuer den Release. Ein Probelauf
    # per workflow_dispatch soll bauen und pruefen, ohne hier rot zu werden.
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefakte

      - name: Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          draft: true          # erst pruefen, dann von Hand veroeffentlichen
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artefakte/quellpaket/*.zip
            artefakte/windows-exe/*.exe
            artefakte/windows-exe/SHA256SUMS.txt
            artefakte/windows-exe/DRITTANBIETER-LIZENZEN.md
