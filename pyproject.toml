[project]
name = "python-script-module-manager"
version = "2.0.1"
description = "Python-Scripts starten, ihre Abhängigkeiten prüfen und die Module aller Python-Installationen verwalten"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Unverhau" }]
dependencies = []                      # nur die Standardbibliothek

[tool.ruff]
line-length = 100
target-version = "py310"
# Ruff prueft .pyw-Dateien sonst nicht - das ganze Programm steckt aber in einer.
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle - Fehler
    "W",    # pycodestyle - Warnungen
    "F",    # Pyflakes
    "I",    # isort - Importreihenfolge
    "B",    # flake8-bugbear - typische Fallstricke
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade - veraltete Schreibweisen
    "RET",  # flake8-return
]
ignore = [
    # Die Farbnamen (BG, CARD, TEXT ...) legt apply_theme() zur Laufzeit als
    # Modulvariablen an; Ruff sieht sie deshalb als undefiniert an.
    "F821",
]

